name: backoffice_officine
description: >
  PoC - Application de gestion de back-office officinal (réception logistique,
  OCR factures, gestion de stock, dashboard KPI) - Pharmacie Démo (données fictives).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Etat de l'application
  provider: ^6.1.2

  # Base de données locale
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Sécurité / chiffrement champ-à-champ (cf. note architecture dans README)
  encrypt: ^5.0.3
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2

  # UI / Graphiques
  fl_chart: ^0.68.0
  intl: ^0.19.0

  # Identifiants uniques (audit, logs)
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
